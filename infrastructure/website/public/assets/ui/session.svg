</defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="url(#bg)" stroke="none"/><rect x="0" y="74" width="1600" height="826" rx="0" fill="url(#mica)" stroke="none"/><rect x="0" y="0" width="1600" height="74" rx="0" fill="#090a0e" stroke="none"/><g transform="translate(28 20) scale(0.34)"><path d="M36 12H64C90 12 102 35 96 57C90 82 71 91 48 91H18Z M47 30L38 73H54C71 73 79 64 82 52C85 40 78 30 65 30Z" fill="url(#logo)" fill-rule="evenodd"/><path d="M4 40L33 37M0 53L30 50M3 66L27 63" stroke="url(#logo)" stroke-width="6" stroke-linecap="round"/><path d="M60 42L50 55H61L53 68L72 51H61L68 42Z" fill="#00d7e2"/></g><text x="74" y="45" font-size="22" fill="url(#DismodePrimaryTextBrush)" font-weight="600" >Dismode</text><text x="258" y="43" font-size="15" fill="#9da5aa" font-weight="600" text-anchor="middle">Główna</text><text x="388" y="43" font-size="15" fill="#9da5aa" font-weight="600" text-anchor="middle">Gry</text><text x="518" y="43" font-size="15" fill="#00d7e2" font-weight="600" text-anchor="middle">Sesja</text><rect x="484" y="69" width="68" height="3" rx="2" fill="#00d7e2" stroke="none"/><text x="648" y="43" font-size="15" fill="#9da5aa" font-weight="600" text-anchor="middle">Wyniki</text><text x="778" y="43" font-size="15" fill="#9da5aa" font-weight="600" text-anchor="middle">Aktualizacje</text><text x="908" y="43" font-size="15" fill="#9da5aa" font-weight="600" text-anchor="middle">Ustawienia</text><text x="1270" y="43" font-size="12" fill="#3dcb70" font-weight="600" >●  SYSTEM GOTOWY</text><text x="1476" y="41" font-size="15" fill="#9da5aa" font-weight="400" >—   □   ×</text><path d="M0 74H1600" stroke="#24292e" stroke-width="1"/><rect x="24" y="92" width="1552" height="119" rx="11" fill="url(#deck)" stroke="url(#deckEdge)"/><text x="48" y="123" font-size="12" fill="#00d7e2" font-weight="600" letter-spacing="1.2">DISMODE / OPTYMALIZACJA SESJI</text><text x="48" y="164" font-size="32" fill="url(#DismodePrimaryTextBrush)" font-weight="600" >Tryb gry i optymalizacja</text><text x="48" y="192" font-size="14" fill="#9da5aa" font-weight="400" >Skonfiguruj profil gry, zoptymalizuj aplikacje tła i uruchom sesję z automatycznym przywracaniem.</text><rect x="1159" y="118" width="241" height="32" rx="16" fill="url(#DismodePillBrush)" stroke="url(#DismodePillBorderBrush)"/><text x="1172" y="139" font-size="12" fill="#3dcb70" font-weight="600" >Automatyczne przywracanie</text><rect x="1410" y="118" width="142" height="32" rx="16" fill="url(#DismodePillBrush)" stroke="url(#DismodePillBorderBrush)"/><text x="1423" y="139" font-size="12" fill="#00d7e2" font-weight="600" >PresentMon ETW</text><rect x="24" y="227" width="714" height="384" rx="11" fill="url(#DismodeCardBrush)" stroke="url(#edge)"/><text x="46" y="263" font-size="20" fill="url(#DismodePrimaryTextBrush)" font-weight="600" >1. Profil gry i priorytet</text><text x="46" y="296" font-size="13" fill="url(#DismodeTertiaryTextBrush)" font-weight="400" >Wybierz grę</text><rect x="46" y="306" width="670" height="40" rx="7" fill="url(#DismodePanelBrush)" stroke="#323c43"/><text x="59" y="332" font-size="14" fill="url(#DismodePrimaryTextBrush)" font-weight="400" >7 Days to Die</text><text x="692" y="332" font-size="13" fill="#9da5aa" font-weight="400" >⌄</text><text x="46" y="374" font-size="12" fill="#9da5aa" font-weight="400" >Steam · zweryfikowana instalacja lokalna</text><text x="46" y="409" font-size="13" fill="url(#DismodeTertiaryTextBrush)" font-weight="400" >Preset optymalizacji</text><rect x="46" y="419" width="322" height="40" rx="7" fill="url(#DismodePanelBrush)" stroke="#323c43"/><text x="59" y="445" font-size="14" fill="url(#DismodePrimaryTextBrush)" font-weight="400" >Zrównoważony</text><text x="344" y="445" font-size="13" fill="#9da5aa" font-weight="400" >⌄</text><text x="384" y="409" font-size="13" fill="url(#DismodeTertiaryTextBrush)" font-weight="400" >Priorytet gry</text><rect x="384" y="419" width="332" height="40" rx="7" fill="url(#DismodePanelBrush)" stroke="#323c43"/><text x="397" y="445" font-size="14" fill="url(#DismodePrimaryTextBrush)" font-weight="400" >Normalny (Zalecany)</text><text x="692" y="445" font-size="13" fill="#9da5aa" font-weight="400" >⌄</text><rect x="46" y="482" width="18" height="18" rx="4" fill="#00d7e2" stroke="url(#DismodePillBorderBrush)"/><text x="74" y="496" font-size="13" fill="url(#DismodePrimaryTextBrush)" font-weight="400" >Zapamiętaj ustawienia dla tej gry</text><rect x="46" y="514" width="18" height="18" rx="4" fill="url(#DismodePanelBrush)" stroke="url(#DismodePillBorderBrush)"/><text x="74" y="528" font-size="13" fill="url(#DismodePrimaryTextBrush)" font-weight="400" >Zapisz te reguły także dla wszystkich innych gier</text><rect x="46" y="546" width="18" height="18" rx="4" fill="url(#DismodePanelBrush)" stroke="url(#DismodePillBorderBrush)"/><text x="74" y="560" font-size="13" fill="url(#DismodePrimaryTextBrush)" font-weight="400" >Automatycznie optymalizuj tę grę, gdy wystartuje poza Dismodeem</text><rect x="24" y="625" width="714" height="249" rx="11" fill="url(#DismodeCardBrush)" stroke="url(#edge)"/><text x="46" y="662" font-size="20" fill="url(#DismodePrimaryTextBrush)" font-weight="600" >Nakładka wydajności (HUD)</text><text x="46" y="691" font-size="13" fill="#9da5aa" font-weight="400" >Wyświetla rzeczywisty FPS i czas generowania klatki w grze.</text><text x="46" y="731" font-size="14" fill="#00d7e2" font-weight="400" >Śledzenie FPS     ● Włączone</text><text x="388" y="731" font-size="14" fill="#00d7e2" font-weight="400" >Nakładka FPS     ● Włączona</text><text x="46" y="772" font-size="13" fill="#9da5aa" font-weight="400" >Krycie  94%           Skala  100%</text><text x="46" y="813" font-size="13" fill="url(#DismodeTertiaryTextBrush)" font-weight="400" >Pozycja na ekranie</text><rect x="46" y="823" width="670" height="40" rx="7" fill="url(#DismodePanelBrush)" stroke="#323c43"/><text x="59" y="849" font-size="14" fill="url(#DismodePrimaryTextBrush)" font-weight="400" >Lewy górny róg</text><text x="692" y="849" font-size="13" fill="#9da5aa" font-weight="400" >⌄</text><rect x="754" y="227" width="822" height="359" rx="11" fill="url(#DismodeCardBrush)" stroke="url(#edge)"/><text x="776" y="263" font-size="20" fill="url(#DismodePrimaryTextBrush)" font-weight="600" >2. Aplikacje w tle</text><rect x="1256" y="242" width="298" height="46" rx="10" fill="url(#DismodePanelBrush)" stroke="#24292e"/><text x="1405" y="270" font-size="14" fill="url(#DismodePrimaryTextBrush)" font-weight="600" text-anchor="middle">Analizuj aplikacje tła</text><text x="776" y="293" font-size="13" fill="#9da5aa" font-weight="400" >Inteligentna selekcja · procesy chronione pominięte</text><rect x="776" y="314" width="778" height="60" rx="10" fill="url(#DismodePanelBrush)" stroke="#24292e"/><text x="797" y="338" font-size="15" fill="url(#DismodePrimaryTextBrush)" font-weight="600" >Discord</text><text x="797" y="360" font-size="12" fill="#9da5aa" font-weight="400" >Ogranicz · BelowNormal + EcoQoS</text><text x="1390" y="340" font-size="14" fill="#00d7e2" font-weight="400" >312 MB</text><rect x="776" y="384" width="778" height="60" rx="10" fill="url(#DismodePanelBrush)" stroke="#24292e"/><text x="797" y="408" font-size="15" fill="url(#DismodePrimaryTextBrush)" font-weight="600" >Spotify</text><text x="797" y="430" font-size="12" fill="#9da5aa" font-weight="400" >Zamknij łagodnie i przywróć po grze</text><text x="1390" y="410" font-size="14" fill="#00d7e2" font-weight="400" >184 MB</text><rect x="776" y="454" width="778" height="60" rx="10" fill="url(#DismodePanelBrush)" stroke="#24292e"/><text x="797" y="478" font-size="15" fill="url(#DismodePrimaryTextBrush)" font-weight="600" >OneDrive</text><text x="797" y="500" font-size="12" fill="#9da5aa" font-weight="400" >Ignoruj</text><text x="1390" y="480" font-size="14" fill="#00d7e2" font-weight="400" >96 MB</text><rect x="754" y="600" width="822" height="274" rx="11" fill="url(#DismodeCardBrush)" stroke="url(#edge)"/><text x="776" y="637" font-size="20" fill="url(#DismodePrimaryTextBrush)" font-weight="600" >3. Uruchomienie sesji</text><text x="776" y="666" font-size="13" fill="#9da5aa" font-weight="400" >Plan gotowy · 2 działania · automatyczny powrót po wyjściu z gry</text><rect x="776" y="690" width="164" height="46" rx="10" fill="url(#DismodePanelBrush)" stroke="#24292e"/><text x="858" y="718" font-size="14" fill="url(#DismodePrimaryTextBrush)" font-weight="600" text-anchor="middle">Sprawdź plan</text><rect x="952" y="690" width="310" height="46" rx="10" fill="#00d7e2" stroke="#00d7e2"/><text x="1107" y="718" font-size="14" fill="#071018" font-weight="600" text-anchor="middle">WŁĄCZ TRYB GRY</text><rect x="1274" y="690" width="280" height="46" rx="10" fill="url(#DismodePanelBrush)" stroke="#24292e"/><text x="1414" y="718" font-size="14" fill="url(#DismodePrimaryTextBrush)" font-weight="600" text-anchor="middle">Zakończ grę</text><rect x="776" y="749" width="320" height="46" rx="10" fill="url(#DismodePanelBrush)" stroke="#24292e"/><text x="936" y="777" font-size="14" fill="url(#DismodePrimaryTextBrush)" font-weight="600" text-anchor="middle">Przywróć aplikacje teraz</text><text x="776" y="834" font-size="16" fill="#00d7e2" font-weight="600" >Plan → Dziennik → Gra → Przywrócenie</text></svg>
