</defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="url(#bg)" stroke="none"/><rect x="0" y="74" width="1600" height="826" rx="0" fill="url(#mica)" stroke="none"/><rect x="0" y="0" width="1600" height="74" rx="0" fill="#090a0e" stroke="none"/><g transform="translate(28 20) scale(0.34)"><path d="M36 12H64C90 12 102 35 96 57C90 82 71 91 48 91H18Z M47 30L38 73H54C71 73 79 64 82 52C85 40 78 30 65 30Z" fill="url(#logo)" fill-rule="evenodd"/><path d="M4 40L33 37M0 53L30 50M3 66L27 63" stroke="url(#logo)" stroke-width="6" stroke-linecap="round"/><path d="M60 42L50 55H61L53 68L72 51H61L68 42Z" fill="#00d7e2"/></g><text x="74" y="45" font-size="22" fill="url(#DismodePrimaryTextBrush)" font-weight="600" >Dismode</text><text x="258" y="43" font-size="15" fill="#9da5aa" font-weight="600" text-anchor="middle">Główna</text><text x="388" y="43" font-size="15" fill="#9da5aa" font-weight="600" text-anchor="middle">Gry</text><text x="518" y="43" font-size="15" fill="#9da5aa" font-weight="600" text-anchor="middle">Sesja</text><text x="648" y="43" font-size="15" fill="#9da5aa" font-weight="600" text-anchor="middle">Wyniki</text><text x="778" y="43" font-size="15" fill="#9da5aa" font-weight="600" text-anchor="middle">Aktualizacje</text><text x="908" y="43" font-size="15" fill="#00d7e2" font-weight="600" text-anchor="middle">Ustawienia</text><rect x="874" y="69" width="68" height="3" rx="2" fill="#00d7e2" stroke="none"/><text x="1270" y="43" font-size="12" fill="#3dcb70" font-weight="600" >●  SYSTEM GOTOWY</text><text x="1476" y="41" font-size="15" fill="#9da5aa" font-weight="400" >—   □   ×</text><path d="M0 74H1600" stroke="#24292e" stroke-width="1"/><rect x="24" y="92" width="1552" height="119" rx="11" fill="url(#deck)" stroke="url(#deckEdge)"/><text x="48" y="123" font-size="12" fill="#00d7e2" font-weight="600" letter-spacing="1.2">DISMODE / CENTRUM KONDYCJI PC</text><text x="48" y="164" font-size="32" fill="url(#DismodePrimaryTextBrush)" font-weight="600" >Diagnostyka i Ustawienia</text><text x="48" y="192" font-size="14" fill="#9da5aa" font-weight="400" >Sprawdź stan optymalizacji Windows, silnika Dismode oraz dostosuj wygląd aplikacji.</text><rect x="1330" y="131" width="218" height="46" rx="10" fill="url(#DismodePanelBrush)" stroke="#24292e"/><text x="1439" y="159" font-size="14" fill="url(#DismodePrimaryTextBrush)" font-weight="600" text-anchor="middle">Sprawdź ponownie</text><rect x="80" y="227" width="712" height="189" rx="11" fill="url(#DismodeCardBrush)" stroke="url(#edge)"/><text x="102" y="265" font-size="20" fill="url(#DismodePrimaryTextBrush)" font-weight="600" >Konfiguracja gamingowa Windows &amp; GPU</text><text x="102" y="303" font-size="14" fill="url(#DismodePrimaryTextBrush)" font-weight="400" >Windows 11 24H2 · Tryb gry: włączony</text><text x="102" y="334" font-size="14" fill="url(#DismodePrimaryTextBrush)" font-weight="400" >HAGS: włączone · sterownik GPU dostępny</text><text x="102" y="371" font-size="13" fill="#9da5aa" font-weight="400" >Odczyt konfiguracji · żadnych automatycznych zmian</text><rect x="808" y="227" width="712" height="189" rx="11" fill="url(#DismodeCardBrush)" stroke="url(#edge)"/><text x="830" y="265" font-size="20" fill="url(#DismodePrimaryTextBrush)" font-weight="600" >Status silnika Dismode</text><text x="830" y="303" font-size="14" fill="#3dcb70" font-weight="400" >Silnik optymalizacji:    Gotowy</text><text x="830" y="334" font-size="14" fill="#00d7e2" font-weight="400" >Agent diagnostyczny:  Tylko odczyt</text><text x="830" y="371" font-size="14" fill="url(#DismodePrimaryTextBrush)" font-weight="400" >System operacyjny:     Windows 11 x64</text><rect x="80" y="430" width="712" height="260" rx="11" fill="url(#DismodeCardBrush)" stroke="url(#edge)"/><text x="102" y="468" font-size="20" fill="url(#DismodePrimaryTextBrush)" font-weight="600" >Wygląd i efekty</text><text x="102" y="501" font-size="13" fill="url(#DismodeTertiaryTextBrush)" font-weight="400" >Motyw aplikacji</text><rect x="102" y="511" width="668" height="40" rx="7" fill="url(#DismodePanelBrush)" stroke="#323c43"/><text x="115" y="537" font-size="14" fill="url(#DismodePrimaryTextBrush)" font-weight="400" >Ciemny (Domyślny)</text><text x="746" y="537" font-size="13" fill="#9da5aa" font-weight="400" >⌄</text><text x="102" y="589" font-size="14" fill="url(#DismodePrimaryTextBrush)" font-weight="400" >Dźwięki interfejsu (SFX)                    Włączone</text><text x="102" y="619" font-size="14" fill="url(#DismodePrimaryTextBrush)" font-weight="400" >Efekty wizualne (VFX)                        Włączone</text><text x="102" y="656" font-size="12" fill="#9da5aa" font-weight="400" >Animacje pulsowania, poświaty i przejść Bento.</text><rect x="808" y="430" width="712" height="260" rx="11" fill="url(#DismodeCardBrush)" stroke="url(#edge)"/><text x="830" y="468" font-size="20" fill="url(#DismodePrimaryTextBrush)" font-weight="600" >Śledzenie wydajności</text><text x="830" y="514" font-size="14" fill="#00d7e2" font-weight="400" >Pomiar FPS                                        Włączony</text><text x="830" y="545" font-size="12" fill="#9da5aa" font-weight="400" >Wyłączenie zatrzymuje pomiar i czyści telemetrię sesji.</text><text x="830" y="595" font-size="14" fill="#00d7e2" font-weight="400" >Nakładka FPS                                     Włączona</text><text x="830" y="626" font-size="12" fill="#9da5aa" font-weight="400" >Wyłączenie ukrywa HUD, ale nie zatrzymuje pomiaru.</text><rect x="80" y="704" width="1440" height="154" rx="11" fill="url(#DismodeCardBrush)" stroke="url(#edge)"/><text x="102" y="739" font-size="20" fill="url(#DismodePrimaryTextBrush)" font-weight="600" >Procesor</text><text x="102" y="767" font-size="13" fill="#9da5aa" font-weight="400" >8 rdzeni · 16 procesorów logicznych · SMT</text><text x="102" y="801" font-size="14" fill="url(#DismodePrimaryTextBrush)" font-weight="400" >Ograniczaj procesy tła w trakcie gry</text><text x="802" y="739" font-size="20" fill="url(#DismodePrimaryTextBrush)" font-weight="600" >Optymalizuj w locie</text><text x="802" y="772" font-size="13" fill="#9da5aa" font-weight="400" >Automatycznie dołącz do gry z jej zapisanymi regułami.</text><text x="802" y="806" font-size="13" fill="#9da5aa" font-weight="400" >Reguły dla wszystkich gier: 2 · wyjątki per gra mają pierwszeństwo.</text></svg>
