<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Segoe UI Variable, Segoe UI, sans-serif" role="img" aria-labelledby="title desc"><title id="title">Dismode — System Optimizer</title><desc id="desc">MainWindow.xaml i App.xaml z Dismode.SystemOptimizer: pasek 48 px, panel nawigacji 244 px, Przegląd, trzy metryki i karta ochrony. Przykładowy stan tylko do odczytu odpowiada publicznemu wydaniu z podpisem testowym.</desc><defs>
