<linearGradient id="deckEdge" x2="1" y2="1"><stop stop-color="#00d7e2" stop-opacity=".7"/><stop offset=".22" stop-color="#2a3339"/><stop offset="1" stop-color="#1c2126"/></linearGradient>
<linearGradient id="hero" x2="1" y2="1"><stop stop-color="#20d5db" stop-opacity=".27"/><stop offset=".58" stop-color="#157b83" stop-opacity=".15"/><stop offset="1" stop-color="#1d252e" stop-opacity=".19"/></linearGradient>
<linearGradient id="scrim"><stop stop-color="#05080c" stop-opacity=".95"/><stop offset=".46" stop-color="#05080c" stop-opacity=".60"/><stop offset=".76" stop-color="#05080c" stop-opacity=".19"/><stop offset="1" stop-color="#05080c" stop-opacity=".06"/></linearGradient>
<linearGradient id="logo" x2=".8" y2="1"><stop stop-color="#c8f4ff"/><stop offset=".3" stop-color="#13b9f0"/><stop offset=".65" stop-color="#1668d2"/><stop offset="1" stop-color="#5020a1"/></linearGradient>
