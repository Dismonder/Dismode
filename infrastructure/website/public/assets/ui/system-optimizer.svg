</defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#070b10" stroke="none"/><rect x="0" y="0" width="1600" height="48" rx="0" fill="#090d12" stroke="none"/><text x="24" y="30" font-size="16" fill="#f2f7f9" font-weight="600" >Dismode System Optimizer</text><rect x="1325" y="8" width="137" height="32" rx="16" fill="#1b2329" stroke="#535d63"/><text x="1338" y="29" font-size="12" fill="#19d3d3" font-weight="600" >Tylko odczyt</text><text x="1480" y="30" font-size="14" fill="#91a2ad" font-weight="400" >—   □   ×</text><rect x="0" y="48" width="244" height="852" rx="0" fill="#0b1117" stroke="none"/><rect x="12" y="72" width="220" height="42" rx="8" fill="#1a252d" stroke="none"/><rect x="12" y="84" width="3" height="18" rx="2" fill="#19d3d3" stroke="none"/><text x="30" y="98" font-size="14" fill="#f2f7f9" font-weight="600" >Przegląd</text><rect x="12" y="122" width="220" height="42" rx="8" fill="#0b1117" stroke="none"/><text x="30" y="148" font-size="14" fill="#f2f7f9" font-weight="400" >Tryb gamingowy</text><rect x="12" y="172" width="220" height="42" rx="8" fill="#0b1117" stroke="none"/><text x="30" y="198" font-size="14" fill="#f2f7f9" font-weight="400" >Profil globalny</text><rect x="12" y="222" width="220" height="42" rx="8" fill="#0b1117" stroke="none"/><text x="30" y="248" font-size="14" fill="#f2f7f9" font-weight="400" >Laboratorium</text><rect x="12" y="272" width="220" height="42" rx="8" fill="#0b1117" stroke="none"/><text x="30" y="298" font-size="14" fill="#ff6978" font-weight="400" >Danger Zone</text><rect x="12" y="322" width="220" height="42" rx="8" fill="#0b1117" stroke="none"/><text x="30" y="348" font-size="14" fill="#f2f7f9" font-weight="400" >Historia i przywracanie</text><text x="276" y="95" font-size="12" fill="#19d3d3" font-weight="600" letter-spacing="1.2">DISMODE / SYSTEM OPTIMIZER</text><text x="276" y="141" font-size="30" fill="#f2f7f9" font-weight="600" >Przegląd</text><text x="276" y="177" font-size="14" fill="#91a2ad" font-weight="400" >Pomiarowe optymalizacje z niezależnym readbackiem i automatycznym restore.</text><rect x="276" y="207" width="1292" height="132" rx="14" fill="#141c23" stroke="#293842"/><text x="296" y="245" font-size="20" fill="#19d3d3" font-weight="600" >Tylko odczyt — klient bez zaufanego podpisu produkcyjnego</text><text x="296" y="275" font-size="14" fill="#91a2ad" font-weight="400" >Dismode niczego nie zmieni bez świadomej zgody i sprawnego recovery.</text><rect x="296" y="290" width="220" height="36" rx="10" fill="#1b1f23" stroke="#24292e"/><text x="406" y="313" font-size="14" fill="#dde2e5" font-weight="600" text-anchor="middle">Włącz bezpieczny tryb</text><rect x="276" y="355" width="420" height="159" rx="14" fill="#141c23" stroke="#293842"/><text x="296" y="388" font-size="12" fill="#19d3d3" font-weight="600" >RECOVERY</text><text x="296" y="438" font-size="32" fill="#f2f7f9" font-weight="600" >Czysty</text><text x="296" y="482" font-size="12" fill="#91a2ad" font-weight="400" >Stan journalu maszyny</text><rect x="712" y="355" width="420" height="159" rx="14" fill="#141c23" stroke="#293842"/><text x="732" y="388" font-size="12" fill="#19d3d3" font-weight="600" >PROFIL GRY</text><text x="732" y="438" font-size="32" fill="#f2f7f9" font-weight="600" >Brak</text><text x="732" y="482" font-size="12" fill="#91a2ad" font-weight="400" >Akcje cofane po zakończeniu gry</text><rect x="1148" y="355" width="420" height="159" rx="14" fill="#141c23" stroke="#293842"/><text x="1168" y="388" font-size="12" fill="#19d3d3" font-weight="600" >EKSPERYMENT</text><text x="1168" y="438" font-size="32" fill="#f2f7f9" font-weight="600" >Brak</text><text x="1168" y="482" font-size="12" fill="#91a2ad" font-weight="400" >Jedna zmiana na kontrolowany test A/B</text><rect x="276" y="530" width="1292" height="188" rx="14" fill="#141c23" stroke="#293842"/><text x="296" y="570" font-size="20" fill="#f2f7f9" font-weight="600" >Jak działa ochrona</text><text x="296" y="611" font-size="15" fill="#91a2ad" font-weight="400" >Każda akcja przechodzi capability check, snapshot, zapis intencji, apply,</text><text x="296" y="639" font-size="15" fill="#91a2ad" font-weight="400" >niezależny readback i checkpoint. Restore porównuje stan original / applied / current</text><text x="296" y="667" font-size="15" fill="#91a2ad" font-weight="400" >i nie nadpisuje zewnętrznych zmian.</text></svg>
