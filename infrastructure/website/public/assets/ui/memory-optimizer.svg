<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Segoe UI Variable, Segoe UI, sans-serif" role="img" aria-labelledby="title desc"><title id="title">Dismode — panel Memory Optimizer</title><desc id="desc">TrayMenuWindow.xaml oraz App.xaml komponentu Dismode.MemoryOptimizer. Panel 400×548 pokazany w skali 1:1 na planszy 1600×900, wcięcia 20 px, karta RAM 130 px i przyciski 44 px. Dane pamięci są przykładowe.</desc><defs>
