# Jedyny recenzent, jakiego ma to repozytorium.
#
# GitHub nie pozwala wlaczyc ochrony galezi na prywatnym repo w planie Free,
# wiec nie da sie wymusic "main tylko przez zielony PR". Ale sam sygnal da sie
# miec: ten workflow buduje calosc i uruchamia testy przy kazdym pushu i kazdym
# PR-ze, wiec widac, czy commit jest zdrowy, zanim wyladuje na main.
#
# Runner jest Windows, bo osiem z trzynastu projektow ma TFM
# net10.0-windows10.0.26100.0 i na Linuksie sie nie zbuduja. Minuty Windows
# licza sie podwojnie wzgledem limitu planu Free — stad concurrency ponizej,
# ktore ubija poprzedni przebieg tej samej galezi zamiast placic za oba.

name: CI

# Push tylko dla main, reszta przez pull_request. Galaz z otwartym PR-em
# odpalalaby oba wyzwalacze naraz i placilibysmy podwojnie za ten sam commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore GameShift.sln

      - name: Build
        run: dotnet build GameShift.sln -c Release --no-restore

      # Testy oznaczone Live dotykaja prawdziwych procesow, obciazaja procesor
      # albo wymagaja uprawnien administratora. Na wspoldzielonym runnerze ich
      # wynik nic nie znaczy, wiec nie udajemy, ze cos mierza.
      - name: Test
        run: >
          dotnet test GameShift.sln -c Release --no-build
          --filter "TestCategory!=Live"
          --logger "trx;LogFileName=test-results.trx"

      - name: Format
        run: dotnet format GameShift.sln --verify-no-changes

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
          retention-days: 14
